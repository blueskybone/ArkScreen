[versions]
# 核心版本 - Koala 2024.1.1 需要这些版本
agp = "8.5.2"        # Android Gradle Plugin
gradle = "8.8"       # Gradle 包装器版本
kotlin = "1.9.22"    # Kotlin 版本 (必须与Compose兼容)
ksp = "1.9.20-1.0.14"
jvmTarget = "17"     # Java 目标版本


koin = "3.4.0"
room = "2.6.1"
retrofit = "2.9.0"
okhttp = "4.12.0"
jackson = "2.15.0"
coil = "2.5.0"
markwon = "4.2.0"


# SDK 版本
compileSdk = "34"
minSdk = "24"
targetSdk = "34"

# Compose 版本 (与 Kotlin 2.0.21 兼容)
compose-bom = "2023.08.00"  # 使用最新的BOM
compose-compiler = "1.5.8"  # 关键修改
compose = "1.6.8"
compose-material3 = "1.2.1"


# 其他库版本
activity-compose = "1.9.0"
lifecycle = "2.8.2"

[plugins]
# 插件定义
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
# Gradle 插件
android-application = { group = "com.android.application", name = "com.android.application.gradle.plugin", version.ref = "agp" }
android-library = { group = "com.android.library", name = "com.android.library.gradle.plugin", version.ref = "agp" }
androidx-activity-compose = { module = "androidx.activity:activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-pager = { module = "androidx.compose.foundation:pager" }
androidx-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
kotlin-android = { group = "org.jetbrains.kotlin.android", name = "org.jetbrains.kotlin.android.gradle.plugin", version.ref = "kotlin" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }

# 其他可能需要的 Compose 依赖
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "compose" }

# AndroidX
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# 其他
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.9.0" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
androidx-coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version = "1.2.0" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version = "3.3.2" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version = "2.8.5" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version = "2.8.5" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version = "2.9.0" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version = "1.12.1" }

# Material
material = { group = "com.google.android.material", name = "material", version = "1.12.0" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-android-compat = { group = "io.insert-koin", name = "koin-android-compat", version.ref = "koin" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-jackson = { group = "com.squareup.retrofit2", name = "converter-jackson", version.ref = "retrofit" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Jackson
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin", version.ref = "jackson" }

# Image Loading
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# Other
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
flow-layout = { group = "com.nex3z", name = "flow-layout", version = "1.3.3" }
timber = { group = "com.jakewharton.timber", name = "timber", version = "5.0.1" }
easy-window = { group = "com.github.getActivity", name = "EasyWindow", version = "10.62" }
toaster = { group = "com.github.getActivity", name = "Toaster", version = "12.6" }
mp-android-chart = {group = "com.github.PhilJay", name = "MPAndroidChart", version = "3.1.0"}
# Test
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.6.1" }


[bundles]
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3"
]